<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flask App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .table-wrap { overflow-x: auto; }
        code { word-break: break-word; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}"></a>
        <div class="navbar-nav flex-wrap">
            <a class="nav-link" href="{{ url_for('url_params') }}">URL-параметры</a>
            <a class="nav-link" href="{{ url_for('headers_page') }}">Заголовки</a>
            <a class="nav-link" href="{{ url_for('cookies_page') }}">Cookie</a>
            <a class="nav-link" href="{{ url_for('login') }}">Авторизация</a>
            <a class="nav-link" href="{{ url_for('phone') }}">Телефон</a>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
