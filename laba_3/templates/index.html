{% extends 'base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="p-5 bg-white rounded-4 shadow-sm">
    <h1 class="display-6 fw-bold mb-3">Главная страница</h1>
    <p class="lead mb-4">Лабораторная работа №3</p>

    {% if current_user.is_authenticated %}
        <div class="alert alert-success mb-0">
            Вы вошли в систему как <strong>{{ current_user.login }}</strong>.
        </div>
    {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-primary">Войти</a>
    {% endif %}
</div>
{% endblock %}
