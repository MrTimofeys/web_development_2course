{% extends 'base.html' %}
{% from '_user_form.html' import user_form %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">{{ title }}</h1>
                <form method="post" novalidate>
                    {{ user_form(data, errors, roles, is_create, role_disabled|default(false)) }}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
